name: Keep Render API alive

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Set the RENDER_URL repository variable to the Render API URL (e.g. https://cinetrack-api.onrender.com)."
            exit 0
          fi
          curl -fsS -o /dev/null -w "health: %{http_code}\n" "$RENDER_URL/api/health" || true
